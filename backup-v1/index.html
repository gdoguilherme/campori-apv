function toast(msg, type='success') {
  const bg = type==='success'?'#16a34a':type==='error'?'#dc2626':'#1e3a8a';
  const t = document.createElement('div');
  t.style.cssText = `position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);
    background:${bg};color:#fff;padding:.75rem 1.25rem;border-radius:1rem;
    font-size:.875rem;font-weight:600;z-index:999;white-space:nowrap;
    box-shadow:0 4px 20px rgba(0,0,0,.2);`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3500);
}

// Banner grande de sucesso — aparece no topo da tela por 4s

// Renderiza bloco de comprovação (imagem, PDF ou vazio) para fila e histórico
function proofBlock(url, context) {
  if (!url) {
    return `<div style="height:52px;background:#f8fafc;display:flex;align-items:center;
      justify-content:center;color:#94a3b8;font-size:.82rem;">Sem arquivo anexado</div>`;
  }
  const isPdf = url.toLowerCase().includes('.pdf') || url.toLowerCase().includes('/raw/');
  if (isPdf) {
    const thumbUrl = url.replace('/upload/', '/upload/f_jpg,pg_1,w_600,c_limit/');
    return `

          onerror="this.style.display='none'">

  // Imagem
  const maxH = context==='queue' ? '220px' : '140px';
  return `
    <div style="cursor:pointer;position:relative;" onclick="W.openPhoto('${url}')">
      <img src="${url}" alt="Comprovação"

        onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">

        <span>⚠️ Imagem não carregou</span>

      </div>
      <div style="background:rgba(30,58,138,.85);color:#fff;text-align:center;font-size:.72rem;padding:.3rem;">
        👆 Toque para ampliar · <a href="${url}" target="_blank" download style="color:#93c5fd;text-decoration:none;">⬇ Baixar</a>
      </div>
    </div>`;
}

function computeScores() {
  const scores = {};
  REGIONS.forEach(r=>{ scores[r.id]={name:r.name,total:0,count:0}; });
  const counted = new Set();
  [...S.submissions]
    .filter(s=>s.status==='approved')
    .sort((a,b)=>(b.submittedAt?.seconds||0)-(a.submittedAt?.seconds||0))
    .forEach(s=>{
      const key=`${s.regionId}:${s.requirementId}`;
      if (!counted.has(key) && scores[s.regionId]) {
        counted.add(key);
        scores[s.regionId].total += s.requirementPoints||0;
        scores[s.regionId].count++;
      }
    });
  return Object.entries(scores).map(([id,v])=>({id,...v})).sort((a,b)=>b.total-a.total);
}

// ════════════════════════════════════════
//  FIREBASE OPS
// ════════════════════════════════════════
function subSubs(regionId) {
  if (_unsubSubs) _unsubSubs();
  S.submissions = []; // ← limpa imediatamente para evitar dados da consulta anterior
  // Sem orderBy no filtro de região para evitar exigir índice composto no Firestore
  const q = regionId
    ? query(collection(db,'submissions'),where('regionId','==',regionId))
    : query(collection(db,'submissions'),orderBy('submittedAt','desc'));
  _unsubSubs = onSnapshot(q, snap=>{
    const docs = snap.docs.map(d=>({id:d.id,...d.data()}));
    // Ordena no cliente para não exigir índice composto
    docs.sort((a,b)=>(b.submittedAt?.seconds||0)-(a.submittedAt?.seconds||0));
    S.submissions = docs;
    render();
  }, err=>{
    console.error('Firestore onSnapshot error:', err);
    toast('Erro ao carregar dados: '+err.message,'error');
  });
}
function subReqs() {
  if (_unsubReqs) _unsubReqs();
  _unsubReqs = onSnapshot(
    query(collection(db,'requirements'),orderBy('order','asc')),
    snap=>{ S.requirements=snap.docs.map(d=>({id:d.id,...d.data()})); render(); }
  );
}

async function uploadFile(file) {
  const fd = new FormData();
  fd.append('file', file);
  const res = await fetch(`${UPLOAD_SERVER}/upload`, { method: 'POST', body: fd });
  const data = await res.json();
  if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
  return data.url;
}

async function doSubmit(reqId, notes, file) {
  S.loading = true; render();
  try {
    const req = S.requirements.find(r=>r.id===reqId);
    const subRef = await addDoc(collection(db,'submissions'), {
      regionId:S.regionId, regionName:rname(S.regionId),
      requirementId:reqId, requirementName:req.name,
      requirementPoints:req.points, requirementCategory:req.category,
      notes, proofUrl:null, status:'pending',
      submittedAt:serverTimestamp(), source:'region'
    });
    // Fecha modal imediatamente
    S.modal=null; S.selectedReq=null; S.photoFile=null; S.loading=false; render();
    showBanner('✅ Requisito registrado! Aguardando aprovação.');

    // Upload Cloudinary em segundo plano
    if (file) {
      try {
        const url = await uploadFile(file);
        await updateDoc(doc(db,'submissions',subRef.id), { proofUrl: url });
        toast('📎 Arquivo enviado com sucesso!');
      } catch(uploadErr) {
        console.error('Upload error:', uploadErr);
        toast(`⚠️ Falha no upload: ${uploadErr.message}`, 'error');
      }
    }
  } catch(e) {
    console.error(e); toast('Erro ao enviar. Tente novamente.','error');
    S.loading=false; render();
  }
}

async function review(subId, status, reason='') {
  await updateDoc(doc(db,'submissions',subId),{
    status, rejectionReason:reason, reviewedAt:serverTimestamp()
  });
  const msgs = {approved:'✅ Aprovado! Pontos computados.', rejected:'❌ Comprovação rejeitada.', pending:'🔄 Reaberto para revisão.'};
  toast(msgs[status]||'Atualizado.', status==='approved'?'success':status==='pending'?'info':'error');
}

async function doJudgeScore(reqId, regionId, pts) {
  const req = S.requirements.find(r=>r.id===reqId);
  // Verifica se já existe pontuação do juiz para esta região+requisito
  const existing = S.submissions.find(s=>
    s.regionId===regionId && s.requirementId===reqId && s.source==='judge'
  );
  if (existing) {
    await updateDoc(doc(db,'submissions',existing.id),{
      requirementPoints:pts, reviewedAt:serverTimestamp(), notes:`Juiz: ${S.judgeCategory}`
    });
  } else {
    await addDoc(collection(db,'submissions'),{
      regionId, regionName:rname(regionId),
      requirementId:reqId, requirementName:req.name,
      requirementPoints:pts, requirementCategory:req.category,
      notes:`Avaliado por Juiz: ${S.judgeCategory}`,
      proofUrl:null, status:'approved',
      submittedAt:serverTimestamp(), source:'judge'
    });
  }
  toast(`✅ ${req.name} — ${pts} pts`);
}

async function saveReq(data) {
  S.loading=true; render();
  try {
    if (data.id) { const {id,...r}=data; await updateDoc(doc(db,'requirements',id),r); }
    else { await addDoc(collection(db,'requirements'),{...data,order:S.requirements.length,active:true}); }
    S.modal=null; S.editingReq=null; toast('Requisito salvo! ✅');
  } catch(e) { toast('Erro ao salvar.','error'); }
  S.loading=false; render();
}
async function delReq(id) {
  if (!confirm('Excluir este requisito?')) return;
  await deleteDoc(doc(db,'requirements',id));
  toast('Excluído.','info');

      <h1 style="font-size:1.3rem;font-weight:800;margin:0;">${reg?.name||S.regionId}</h1>
      <p style="color:#93c5fd;font-size:.8rem;margin:.2rem 0 1rem;">Portal de Comprovações</p>
      <div style="display:flex;gap:.75rem;">
        <div style="background:rgba(255,255,255,.18);border-radius:.875rem;padding:.75rem 1rem;text-align:center;flex:1;">
          <div style="font-size:1.6rem;font-weight:800;">${approved}</div>
          <div style="font-size:.7rem;color:#93c5fd;">pts aprovados</div>
        </div>
        <div style="background:rgba(255,255,255,.18);border-radius:.875rem;padding:.75rem 1rem;text-align:center;flex:1;">
          <div style="font-size:1.6rem;font-weight:800;color:#fde68a;">${pending}</div>
          <div style="font-size:.7rem;color:#93c5fd;">pts pendentes</div>
        </div>
        <div style="background:rgba(255,255,255,.18);border-radius:.875rem;padding:.75rem 1rem;text-align:center;flex:1;">
          <div style="font-size:1.6rem;font-weight:800;">${mySubs.length}</div>
          <div style="font-size:.7rem;color:#93c5fd;">enviados</div>
        </div>
      </div>
    </div>
    <div style="background:#fff;border-bottom:1px solid #f1f5f9;padding:.625rem 1rem;display:flex;gap:.5rem;overflow-x:auto;">
      ${cats.map(c=>`
        <button onclick="W.filterCat('${c}')"
          style="white-space:nowrap;padding:.375rem .875rem;border-radius:999px;border:none;
          font-size:.8rem;font-weight:600;cursor:pointer;
          background:${S.filterCat===c?'#1e3a8a':'#f1f5f9'};
          color:${S.filterCat===c?'#fff':'#64748b'};">
          ${c}
        </button>
      `).join('')}
    </div>
    <div style="padding:1rem;display:flex;flex-direction:column;gap:.75rem;padding-bottom:5rem;">
      ${list.length===0?`
        <div style="text-align:center;padding:4rem 1rem;color:#94a3b8;">
          <div style="font-size:3rem;margin-bottom:.75rem;">📋</div>
          <p style="font-weight:600;">Nenhum requisito cadastrado ainda</p>
        </div>`
      :list.map(req=>{
        const sub = subByReq[req.id];
        const isApproved = sub?.status==='approved';
        const isPending  = sub?.status==='pending';
        const isRejected = sub?.status==='rejected';
        const bl = isApproved?'4px solid #16a34a':isPending?'4px solid #f59e0b':isRejected?'4px solid #ef4444':'none';
        return `
        <div style="background:#fff;border-radius:1rem;border:1px solid #e2e8f0;border-left:${bl};
          padding:1rem;box-shadow:0 1px 3px rgba(0,0,0,.06);">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem;">
            <div style="flex:1;">
              <div style="display:flex;flex-wrap:wrap;gap:.375rem;margin-bottom:.5rem;">
                <span style="background:#f1f5f9;color:#475569;font-size:.7rem;font-weight:600;padding:.2rem .6rem;border-radius:999px;">${req.category}</span>
                <span style="background:#dbeafe;color:#1d4ed8;font-size:.7rem;font-weight:700;padding:.2rem .6rem;border-radius:999px;">${req.points} pts</span>
                ${req.phase?`<span style="background:#f0fdf4;color:#166534;font-size:.7rem;font-weight:600;padding:.2rem .6rem;border-radius:999px;">${req.phase}</span>`:''}
              </div>
              <div style="font-weight:700;color:#1e293b;font-size:.95rem;">${req.name}</div>
              ${req.description?`<div style="font-size:.8rem;color:#64748b;margin-top:.25rem;">${req.description}</div>`:''}
              ${sub
                ? `<div style="margin-top:.625rem;display:flex;flex-direction:column;gap:.25rem;">
                    ${isApproved
                      ? `<span style="background:#d1fae5;color:#065f46;font-size:.8rem;font-weight:700;padding:.3rem .8rem;border-radius:999px;display:inline-block;">✅ Aprovado</span>`
                      : isPending
                        ? `<span style="background:#fef3c7;color:#92400e;font-size:.8rem;font-weight:700;padding:.3rem .8rem;border-radius:999px;display:inline-block;">⏳ Em aprovação — aguarde</span>`
                        : `<span style="background:#fee2e2;color:#991b1b;font-size:.8rem;font-weight:700;padding:.3rem .8rem;border-radius:999px;display:inline-block;">❌ Recusado</span>`}
                    ${isRejected && sub.rejectionReason
                      ? `<div style="font-size:.8rem;color:#b91c1c;background:#fff1f1;border-radius:.5rem;padding:.4rem .75rem;">
                           <strong>Motivo:</strong> ${sub.rejectionReason}
                         </div>`
                      : ''}
                  </div>`
                : `<div style="margin-top:.5rem;font-size:.8rem;color:#94a3b8;">Não enviado</div>`}
            </div>
            <div style="flex-shrink:0;">
              ${isApproved?`<span style="font-size:1.75rem;">✅</span>`:
                isPending?`<span style="font-size:1.75rem;">⏳</span>`:
                `<button onclick="W.openSubmit('${req.id}')"
                  style="background:#1e3a8a;color:#fff;border:none;padding:.5rem 1rem;
                  border-radius:.75rem;font-size:.85rem;font-weight:700;cursor:pointer;">
                  Enviar
                </button>`}
            </div>
          </div>
          ${isRejected?`
            <button onclick="W.openSubmit('${req.id}')"
              style="width:100%;margin-top:.75rem;padding:.75rem;
              background:#eff6ff;border:1.5px solid #bfdbfe;border-radius:.75rem;color:#1d4ed8;
              font-size:.875rem;font-weight:700;cursor:pointer;">
              🔄 Reenviar comprovação
            </button>
          `:''}
          ${isPending?`
            <div style="margin-top:.625rem;font-size:.78rem;color:#92400e;background:#fef9c3;
              border-radius:.5rem;padding:.4rem .75rem;text-align:center;">
              Aguardando revisão — não é possível reenviar enquanto estiver pendente
            </div>
          `:''}
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function mSubmit() {
  const req = S.requirements.find(r=>r.id===S.selectedReq);
  if (!req) return '';
  return `
  <div class="modal-overlay" onclick="if(event.target===this)W.closeModal()">
    <div class="modal-content">
      <div style="width:2.5rem;height:.25rem;background:#e2e8f0;border-radius:999px;margin:0 auto .875rem;"></div>
      <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.5rem;">
        <span style="background:#f1f5f9;color:#475569;font-size:.75rem;font-weight:600;padding:.25rem .75rem;border-radius:999px;">${req.category}</span>
        <span style="background:#dbeafe;color:#1d4ed8;font-size:.75rem;font-weight:700;padding:.25rem .75rem;border-radius:999px;">${req.points} pontos</span>
      </div>
      <h2 style="font-size:1.15rem;font-weight:800;color:#1e293b;margin:.25rem 0 .5rem;">${req.name}</h2>
      ${req.description?`<p style="font-size:.85rem;color:#64748b;margin-bottom:1rem;">${req.description}</p>`:''}
      <div style="margin-bottom:1rem;">
        <label style="display:block;font-size:.85rem;font-weight:700;color:#374151;margin-bottom:.5rem;">📎 Comprovação</label>
        <div class="upload-area ${S.photoFile?'filled':''}" onclick="document.getElementById('file-inp').click()">
          ${S.photoFile
            ?`<div style="color:#16a34a;font-weight:700;font-size:.95rem;">✅ ${S.photoFile.name}</div>
               <div style="font-size:.75rem;color:#6b7280;margin-top:.3rem;">Toque para trocar o arquivo</div>`
            :`<div style="font-size:2.75rem;margin-bottom:.5rem;">📷</div>
              <div style="font-weight:700;color:#374151;font-size:1rem;">Toque para selecionar</div>
              <div style="font-size:.78rem;color:#9ca3af;margin-top:.3rem;">Foto ou PDF — câmera ou galeria</div>`}
        </div>
        <input type="file" id="file-inp" accept="image/*,application/pdf" capture="environment" onchange="W.handleFile(event)">
      </div>

      <div style="margin-bottom:1.25rem;">
        <label style="display:block;font-size:.85rem;font-weight:700;color:#374151;margin-bottom:.5rem;">💬 Observações <span style="font-weight:400;color:#94a3b8;">(opcional)</span></label>
        <textarea id="sub-notes" rows="2" placeholder="Informações adicionais sobre este requisito..."
          style="width:100%;border:1.5px solid #e2e8f0;border-radius:.875rem;padding:.75rem;
          font-size:.9rem;resize:none;outline:none;font-family:inherit;"></textarea>
      </div>

      <button onclick="W.doSubmit()" ${S.loading?'disabled':''}
        style="width:100%;background:#1e3a8a;color:#fff;border:none;padding:1.1rem;
        border-radius:1rem;font-size:1rem;font-weight:800;cursor:pointer;opacity:${S.loading?.6:1};">
        ${S.loading?'⏳ Registrando...':'✅ Enviar Comprovação'}
      </button>
      <button onclick="W.closeModal()"
        style="width:100%;margin-top:.625rem;padding:.875rem;background:none;border:none;color:#9ca3af;cursor:pointer;">Cancelar</button>
    </div>
  </div>`;
}

function vJudge() {
  if (!S.judgeAuthed) return vJudgeLogin();

}

function vJudgeLogin() {
  return `
  <div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:1.5rem;background:linear-gradient(160deg,#4c1d95,#7c3aed);">

          style="width:100%;border:1.5px solid #e2e8f0;border-radius:.875rem;padding:1rem;

          onkeydown="if(event.key==='Enter')W.checkJudgePwd()">
      </div>
      <button onclick="W.checkJudgePwd()"

      </button>

}

function vJudgeSelectRegion() {
  return `
  <div style="min-height:100dvh;background:#f5f3ff;">
    <div style="background:linear-gradient(135deg,#4c1d95,#7c3aed);color:#fff;padding:1rem 1rem 1.5rem;">
      <button onclick="W.judgeOut()" style="background:none;border:none;color:#ddd6fe;cursor:pointer;font-size:.85rem;display:block;margin-bottom:.5rem;">← Sair</button>
      <h1 style="font-size:1.3rem;font-weight:800;margin:0;">⚖️ Juiz — ${S.judgeCategory}</h1>
      <p style="color:#ddd6fe;font-size:.85rem;margin:.25rem 0 0;">Selecione a região a avaliar</p>
    </div>
    <div style="padding:1rem;display:grid;grid-template-columns:1fr 1fr;gap:.625rem;">
      ${REGIONS.map(r=>{
        const judgeScore = S.submissions.filter(s=>s.regionId===r.id && s.source==='judge' && s.requirementCategory===S.judgeCategory);
        const pts = judgeScore.reduce((a,s)=>a+(s.requirementPoints||0),0);
        const total = S.requirements.filter(req=>req.category===S.judgeCategory && req.active!==false).reduce((a,r)=>a+r.points,0);
        return `
        <button onclick="W.selectJudgeRegion('${r.id}')"
          style="padding:1rem;border:1.5px solid #e2e8f0;border-radius:1rem;
          text-align:left;background:#fff;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06);">
          <div style="font-size:.7rem;color:#94a3b8;margin-bottom:.2rem;">${r.id}</div>
          <div style="font-weight:700;color:#1e293b;font-size:.9rem;">${r.name}</div>
          <div style="font-size:.75rem;color:#7c3aed;font-weight:600;margin-top:.375rem;">
            ${pts} / ${total} pts
          </div>
        </button>`;
      }).join('')}
    </div>
  </div>`;
}

function vJudgeScore() {
  const reg = REGIONS.find(r=>r.id===S.judgeRegionId);
  const reqs = S.requirements.filter(r=>r.category===S.judgeCategory && r.active!==false);
  const existingScores = {};
  S.submissions.filter(s=>s.regionId===S.judgeRegionId && s.source==='judge').forEach(s=>{
    existingScores[s.requirementId] = s;
  });

  return `
  <div style="min-height:100dvh;background:#f5f3ff;">
    <div style="background:linear-gradient(135deg,#4c1d95,#7c3aed);color:#fff;padding:1rem 1rem 1.5rem;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div>
          <button onclick="W.selectJudgeRegion(null)" style="background:none;border:none;color:#ddd6fe;cursor:pointer;font-size:.85rem;display:block;margin-bottom:.25rem;">← Regiões</button>
          <h1 style="font-size:1.25rem;font-weight:800;margin:0;">⚖️ ${reg?.name}</h1>
          <p style="color:#ddd6fe;font-size:.82rem;margin:.25rem 0 0;">Categoria: ${S.judgeCategory}</p>
        </div>
        <button onclick="W.judgeOut()" style="background:rgba(0,0,0,.2);border:none;color:#fff;padding:.4rem .875rem;border-radius:.625rem;font-size:.8rem;cursor:pointer;">Sair</button>
      </div>
    </div>
    <div style="padding:1rem;display:flex;flex-direction:column;gap:.75rem;padding-bottom:5rem;">
      ${reqs.length===0?`
        <div style="text-align:center;padding:4rem 1rem;color:#94a3b8;">
          <div style="font-size:3rem;margin-bottom:.75rem;">📋</div>
          <p style="font-weight:600;">Nenhum requisito nesta categoria</p>
        </div>`
      :reqs.map(req=>{
        const existing = existingScores[req.id];
        const scored = !!existing;
        return `
        <div style="background:#fff;border-radius:1rem;border:1px solid ${scored?'#a78bfa':'#e2e8f0'};
          border-left:4px solid ${scored?'#7c3aed':'#e2e8f0'};
          padding:1rem;box-shadow:0 1px 3px rgba(0,0,0,.06);">
          <div style="display:flex;flex-wrap:wrap;gap:.375rem;margin-bottom:.5rem;">
            <span style="background:#ede9fe;color:#6d28d9;font-size:.7rem;font-weight:700;padding:.2rem .6rem;border-radius:999px;">${req.points} pts máx</span>
            ${req.phase?`<span style="background:#f0fdf4;color:#166534;font-size:.7rem;font-weight:600;padding:.2rem .6rem;border-radius:999px;">${req.phase}</span>`:''}
            ${scored?`<span class="badge-judge">⚖️ Pontuado: ${existing.requirementPoints} pts</span>`:''}
          </div>
          <div style="font-weight:700;color:#1e293b;font-size:.95rem;margin-bottom:.5rem;">${req.name}</div>
          ${req.description?`<div style="font-size:.8rem;color:#64748b;margin-bottom:.75rem;">${req.description}</div>`:''}
          <div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;">
            <input type="number" id="pts-${req.id}" value="${existing?.requirementPoints??''}"
              min="0" max="${req.points}" placeholder="0"
              style="width:80px;border:1.5px solid #e2e8f0;border-radius:.625rem;padding:.5rem;
              font-size:1rem;text-align:center;outline:none;font-weight:700;">
            <span style="font-size:.85rem;color:#64748b;">/ ${req.points} pts</span>
            <button onclick="W.submitJudgeScore('${req.id}','${S.judgeRegionId}')"
              style="flex:1;min-width:120px;background:#7c3aed;color:#fff;border:none;
              padding:.625rem 1rem;border-radius:.75rem;font-size:.9rem;font-weight:700;cursor:pointer;">
              ${scored?'🔄 Atualizar':'✅ Confirmar'}
            </button>
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

  const tabs = [
    {id:'queue',label:'📋 Fila',count:pendingCount},
    {id:'requirements',label:'⚙️ Requisitos',count:null},
    {id:'history',label:'📂 Histórico',count:null},
    {id:'config',label:'🔑 Senhas',count:null},

    <div style="background:linear-gradient(135deg,#14532d,#166534);color:#fff;padding:1rem;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <button onclick="W.nav('home')" style="background:none;border:none;color:#bbf7d0;font-size:.8rem;cursor:pointer;display:block;margin-bottom:.25rem;">← Início</button>
          <h1 style="font-size:1.25rem;font-weight:800;margin:0;">Painel ADM</h1>

        <button onclick="W.adminOut()" style="background:rgba(0,0,0,.2);border:none;color:#fff;padding:.5rem 1rem;border-radius:.625rem;font-size:.8rem;cursor:pointer;">Sair</button>

  if (!pending.length) return `
    <div style="text-align:center;padding:4rem 1rem;color:#94a3b8;">
      <div style="font-size:3.5rem;margin-bottom:.75rem;">🎉</div>
      <p style="font-weight:700;font-size:1.05rem;">Nenhuma comprovação pendente!</p>
    </div>`;
  return `
    <p style="font-size:.8rem;color:#94a3b8;margin-bottom:.875rem;">${pending.length} aguardando revisão</p>
    <div style="display:flex;flex-direction:column;gap:.875rem;">
      ${pending.map(sub=>`
        <div style="background:#fff;border-radius:1.125rem;border:1px solid #e2e8f0;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06);">
          ${proofBlock(sub.proofUrl, 'queue')}
          <div style="padding:1rem;">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem;margin-bottom:.875rem;">
              <div>
                <div style="font-weight:800;color:#1e293b;font-size:.95rem;">${sub.requirementName}</div>
                <div style="font-size:.82rem;color:#64748b;margin-top:.15rem;">${sub.regionName} · <strong style="color:#1d4ed8;">${sub.requirementPoints} pts</strong></div>
                <div style="font-size:.72rem;color:#94a3b8;margin-top:.15rem;">${fmtDate(sub.submittedAt)}</div>
                ${sub.notes?`<div style="background:#f8fafc;border-radius:.625rem;padding:.5rem .75rem;font-size:.82rem;color:#475569;margin-top:.5rem;">"${sub.notes}"</div>`:''}
              </div>
              <span style="background:#f1f5f9;color:#475569;font-size:.7rem;font-weight:600;padding:.2rem .6rem;border-radius:999px;white-space:nowrap;flex-shrink:0;">${sub.requirementCategory}</span>
            </div>

// ════════════════════════════════════════
//  RENDER
// ════════════════════════════════════════
function render() {
  let html = '';
  if      (S.view==='home')    html = vHome();
  else if (S.view==='portal')  html = vPortal();
  else if (S.view==='admin')   html = vAdmin();
  else if (S.view==='judge')   html = vJudge();
  else if (S.view==='ranking') html = vRanking();

  if      (S.modal==='region')     html += mRegion();
  else if (S.modal==='region-pwd') html += mRegionPwd();
  else if (S.modal==='submit')     html += mSubmit();
  else if (S.modal==='req-form')   html += mReqForm();
  else if (S.modal==='photo')      html += mPhoto();

  app.innerHTML = html;
}

// ════════════════════════════════════════
//  ACTIONS
// ════════════════════════════════════════
window.W = {
  nav(view) {
    S.view=view; S.modal=null;
    if (view==='portal' && S.regionId) { subSubs(S.regionId); subReqs(); }
    else if (view==='admin')   { subSubs(null); subReqs(); }
    else if (view==='judge')   { subSubs(null); subReqs(); }
    else if (view==='ranking') { subSubs(null); }
    render();
  },
  openRegionModal() { S.modal='region'; render(); },
  closeModal()      { S.modal=null; render(); },

  // Região com senha
  selectRegion(id) {
    const code = CFG.regionPasswords[id];
    if (code) { S.pendingRegion=id; S.modal='region-pwd'; render(); }
    else { S.regionId=id; S.filterCat='Todos'; S.modal=null; W.nav('portal'); }
  },
  checkRegionPwd() {
    const v = (document.getElementById('region-pwd')?.value||'').toUpperCase();
    const expected = (CFG.regionPasswords[S.pendingRegion]||'').toUpperCase();
    if (v===expected) { S.regionId=S.pendingRegion; S.filterCat='Todos'; S.modal=null; W.nav('portal'); }
    else { toast('Código incorreto','error'); document.getElementById('region-pwd').value=''; }
  },

  filterCat(cat)    { S.filterCat=cat; render(); },
  filterStatus(st)  { S.filterStatus=st; render(); },
  openSubmit(reqId) { S.selectedReq=reqId; S.photoFile=null; S.modal='submit'; render(); },
  handleFile(evt)   {
    const f = evt.target.files[0]||null;
    if (f && f.size > 10485760) {
      toast('⚠️ Arquivo muito grande! Máximo 10 MB. Comprima a imagem ou use um PDF menor.', 'red');
      evt.target.value = '';
      S.photoFile = null;
    } else {
      S.photoFile = f;
    }
    render();
  },
  async doSubmit()  {
    const notes = document.getElementById('sub-notes')?.value||'';
    await doSubmit(S.selectedReq, notes, S.photoFile);
  },

  // Admin
  checkPwd() {
    const v = document.getElementById('adm-pwd')?.value;
    if (v===CFG.adminPassword) { S.adminAuthed=true; subSubs(null); subReqs(); render(); }
    else { toast('Senha incorreta','error'); document.getElementById('adm-pwd').value=''; }
  },
  adminOut() { S.adminAuthed=false; if(_unsubSubs)_unsubSubs(); if(_unsubReqs)_unsubReqs(); W.nav('home'); },
  setTab(tab) { S.adminTab=tab; render(); },
  approve(id) { review(id,'approved'); },
  reject(id)  { const r=prompt('Motivo da rejeição (opcional):')||''; review(id,'rejected',r); },
  reopen(id)  { if(confirm('Reverter para pendente?')) review(id,'pending'); },
  openReqForm(id) { S.editingReq=id?S.requirements.find(r=>r.id===id):{}; S.modal='req-form'; render(); },
  async saveReq() {
    const name  = document.getElementById('rq-name')?.value?.trim();
    const desc  = document.getElementById('rq-desc')?.value?.trim();
    const cat   = document.getElementById('rq-cat')?.value;
    const phase = document.getElementById('rq-phase')?.value;
    const pts   = parseInt(document.getElementById('rq-pts')?.value)||0;
    const activeEl = document.getElementById('rq-active');
    const active   = activeEl?activeEl.checked:true;
    if (!name) { toast('Nome é obrigatório','error'); return; }
    if (!pts)  { toast('Pontuação inválida','error'); return; }
    await saveReq({...(S.editingReq?.id?{id:S.editingReq.id}:{}),name,description:desc,category:cat,phase,points:pts,active});
  },
  delReq(id) { delReq(id); },
  openPhoto(url) { S.photoUrl=url; S.modal='photo'; render(); },

  // Config / Senhas
  async saveAdminPwd() {
    CFG.adminPassword = document.getElementById('cfg-admin-pwd')?.value||CFG.adminPassword;
    await saveConfig(); toast('Senha do ADM salva!');
  },
  async saveJudgePwd() {
    CFG.judgePassword = document.getElementById('cfg-judge-pwd')?.value||CFG.judgePassword;
    await saveConfig(); toast('Senha dos Juízes salva!');
  },
  async saveRegionCodes() {
    REGIONS.forEach(r=>{
      const v = (document.getElementById(`code-${r.id}`)?.value||'').toUpperCase();
      CFG.regionPasswords[r.id] = v;
    });
    await saveConfig(); toast('Códigos das regiões salvos! ✅');
  },
  genCodes() {
    const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    REGIONS.forEach(r=>{
      const code=Array.from({length:4},()=>chars[Math.floor(Math.random()*chars.length)]).join('');
      const el = document.getElementById(`code-${r.id}`);
      if(el) el.value=code;
    });
  },

  // Juízes
  checkJudgePwd() {
    const cat = document.getElementById('judge-cat')?.value;
    const pwd = document.getElementById('judge-pwd')?.value;
    if (!cat) { toast('Selecione uma categoria','error'); return; }
    if (pwd===CFG.judgePassword) {
      S.judgeAuthed=true; S.judgeCategory=cat; S.judgeRegionId=null;
      render();
    } else { toast('Senha incorreta','error'); document.getElementById('judge-pwd').value=''; }
  },
  judgeOut() { S.judgeAuthed=false; S.judgeCategory=null; S.judgeRegionId=null; W.nav('home'); },
  selectJudgeRegion(id) { S.judgeRegionId=id; render(); },
  async submitJudgeScore(reqId, regionId) {
    const pts = parseInt(document.getElementById(`pts-${reqId}`)?.value)||0;
    const req = S.requirements.find(r=>r.id===reqId);
    if (pts<0||pts>req.points) { toast(`Valor entre 0 e ${req.points}`,'error'); return; }
    await doJudgeScore(reqId, regionId, pts);
    render();
  },
};

// ════════════════════════════════════════
//  INIT
// ════════════════════════════════════════
(async () => {
  await loadConfig();
  render();
})();
</script>
</body>
