<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Campori de Líderes APV</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;overscroll-behavior:none;}
    #app{min-height:100dvh;background:#f0f4f8;}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
    .modal-overlay.center{align-items:center;padding:1rem;}
    .modal-content{background:#fff;border-radius:1.5rem 1.5rem 0 0;width:100%;max-width:600px;max-height:92dvh;overflow-y:auto;padding:1.5rem;}
    .modal-overlay.center .modal-content{border-radius:1.5rem;}
    .badge-pending{background:#fef3c7;color:#92400e;font-size:.7rem;font-weight:700;padding:.2rem .6rem;border-radius:999px;}
    .badge-approved{background:#d1fae5;color:#065f46;font-size:.7rem;font-weight:700;padding:.2rem .6rem;border-radius:999px;}
    .badge-rejected{background:#fee2e2;color:#991b1b;font-size:.7rem;font-weight:700;padding:.2rem .6rem;border-radius:999px;}
    .badge-judge{background:#ede9fe;color:#5b21b6;font-size:.7rem;font-weight:700;padding:.2rem .6rem;border-radius:999px;}
    .upload-area{border:2px dashed #cbd5e1;border-radius:.875rem;padding:1.5rem;text-align:center;cursor:pointer;transition:all .2s;}
    .upload-area:hover{border-color:#1e3a8a;background:#eff6ff;}
    .upload-area.filled{border-color:#16a34a;background:#f0fdf4;border-style:solid;}
    input[type="file"]{display:none;}
    .tab-btn{flex:1;padding:.75rem .25rem;text-align:center;font-size:.75rem;font-weight:600;color:#6b7280;border-bottom:3px solid transparent;transition:all .15s;}
    .tab-btn.active{color:#1e3a8a;border-bottom-color:#1e3a8a;}
    .spinner{width:2rem;height:2rem;border:3px solid #e2e8f0;border-top-color:#1e3a8a;border-radius:50%;animation:spin .7s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    button:active{opacity:.85;transform:scale(.97);}
    ::-webkit-scrollbar{width:4px;}
    ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:2px;}
    @media print{
      .no-print{display:none!important;}
      #app{background:#fff;}
    }
  </style>
</head>
<body>
<div id="app"><div style="display:flex;align-items:center;justify-content:center;min-height:100dvh;"><div class="spinner"></div></div></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getFirestore,collection,doc,getDocs,addDoc,updateDoc,deleteDoc,setDoc,getDoc,
  query,where,orderBy,onSnapshot,serverTimestamp}
  from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

// ── CONFIG ───────────────────────────────────────────────────
const firebaseConfig={
  apiKey:"AIzaSyAUSqOEZ06Tekk-YMvX0X4UQpENJWhFm3g",
  authDomain:"campori-apv.firebaseapp.com",
  projectId:"campori-apv",
  storageBucket:"campori-apv.firebasestorage.app",
  messagingSenderId:"235508891969",
  appId:"1:235508891969:web:58944479146eef0fc261c0"
};
const db=getFirestore(initializeApp(firebaseConfig));
const UPLOAD_SERVER='https://files.gdtmidia.com.br';

// ── CONSTANTES ────────────────────────────────────────────────
const REGIONS=[
  {id:'001R1',name:'1ª Região'},{id:'002R2',name:'2ª Região'},
  {id:'003R3',name:'3ª Região'},{id:'004R4',name:'4ª Região'},
  {id:'005R5',name:'5ª Região'},{id:'006R6',name:'6ª Região'},
  {id:'007R7',name:'7ª Região'},{id:'008R8',name:'8ª Região'},
  {id:'009R9',name:'9ª Região'},{id:'010R10',name:'10ª Região'},
  {id:'011R11',name:'11ª Região'},{id:'012R12',name:'12ª Região'},
  {id:'013R13',name:'13ª Região'},{id:'014R14',name:'14ª Região'},
  {id:'015R15',name:'15ª Região'},{id:'016R16',name:'16ª Região'},
];
const CATEGORIES=['ADM','Nas Casas','Nos Templos','Nas Ruas','Acampamento','Cozinha','Saúde','Eventos','Outros'];
const PHASES=['Pré-Requisito','No Campori'];
const ROLES={superadmin:'Super Admin',admin:'Administrador',approver:'Aprovador',judge:'Juiz',region:'Região'};

// ── ESTADO ────────────────────────────────────────────────────
const S={
  view:'home', currentUser:null,
  adminTab:'queue', judgeRegionId:null,
  modal:null, selectedReq:null, editingReq:null, editingUser:null,
  photoFile:null, photoUrl:null,
  filterCat:'Todos', filterStatus:'Todos',
  loading:false,
  requirements:[], submissions:[], users:[],
  generatedPwd:'', formRole:'',
  firstRunPwd:null,
};
let _unsubSubs=null,_unsubReqs=null,_unsubUsers=null;
const app=document.getElementById('app');

// ── HELPERS ────────────────────────────────────────────────────
const rname=id=>REGIONS.find(r=>r.id===id)?.name||id;
const fmtDate=ts=>{
  if(!ts)return'—';
  const d=ts.toDate?ts.toDate():new Date(ts);
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
};
const badge=(status,source)=>{
  if(source==='judge')return'<span class="badge-judge">⚖️ Juiz</span>';
  if(status==='approved')return'<span class="badge-approved">✅ Aprovado</span>';
  if(status==='rejected')return'<span class="badge-rejected">❌ Rejeitado</span>';
  return'<span class="badge-pending">⏳ Pendente</span>';
};
function toast(msg,type='success'){
  const bg=type==='success'?'#16a34a':type==='error'?'#dc2626':'#1e3a8a';
  const t=document.createElement('div');
  t.style.cssText=`position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);
    background:${bg};color:#fff;padding:.75rem 1.25rem;border-radius:1rem;
    font-size:.875rem;font-weight:600;z-index:999;white-space:nowrap;max-width:90vw;
    box-shadow:0 4px 20px rgba(0,0,0,.2);text-align:center;`;
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),3500);
}
function showBanner(msg){
  const b=document.createElement('div');
  b.style.cssText=`position:fixed;top:0;left:0;right:0;z-index:998;
    background:#15803d;color:#fff;text-align:center;padding:1.1rem 1rem;
    font-size:1rem;font-weight:800;box-shadow:0 4px 20px rgba(0,0,0,.2);
    animation:slideDown .3s ease;`;
  b.innerHTML=msg;
  document.body.appendChild(b);
  setTimeout(()=>{b.style.transition='opacity .4s';b.style.opacity='0';setTimeout(()=>b.remove(),400);},3500);
  if(!document.getElementById('banner-css')){
    const s=document.createElement('style');s.id='banner-css';
    s.textContent='@keyframes slideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}';
    document.head.appendChild(s);
  }
}
function genPassword(len=8){
  const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return Array.from({length:len},()=>c[Math.floor(Math.random()*c.length)]).join('');
}
function proofBlock(url,context){
  if(!url)return`<div style="height:52px;background:#f8fafc;display:flex;align-items:center;
    justify-content:center;color:#94a3b8;font-size:.82rem;">Sem arquivo anexado</div>`;
  const isPdf=url.toLowerCase().includes('.pdf');
  if(isPdf){
    const thumb=url.replace('/upload/','/upload/f_jpg,pg_1,w_600,c_limit/');
    return`<div style="background:#f8fafc;border-bottom:1px solid #e2e8f0;">
      <img src="${thumb}" style="width:100%;max-height:200px;object-fit:contain;display:block;background:#f1f5f9;" onerror="this.style.display='none'">
      <button onclick="window.open('${url}','_blank')" style="display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;padding:.75rem;background:#1e3a8a;color:#fff;font-size:.85rem;font-weight:700;border:none;cursor:pointer;">📄 Abrir PDF</button>
    </div>`;
  }
  const maxH=context==='queue'?'220px':'140px';
  return`<div style="cursor:pointer;position:relative;" onclick="W.openPhoto('${url}')">
    <img src="${url}" style="width:100%;max-height:${maxH};object-fit:cover;display:block;"
      onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
    <div style="display:none;padding:.875rem;background:#fff1f1;color:#dc2626;font-size:.82rem;text-align:center;flex-direction:column;gap:.375rem;">
      <span>⚠️ Imagem não carregou</span>
      <a href="${url}" target="_blank" style="color:#1d4ed8;text-decoration:underline;">Abrir arquivo</a>
    </div>
    <div style="background:rgba(30,58,138,.85);color:#fff;text-align:center;font-size:.72rem;padding:.3rem;">
      👆 Toque para ampliar · <a href="${url}" target="_blank" style="color:#93c5fd;text-decoration:none;">⬇ Baixar</a>
    </div>
  </div>`;
}
function computeScores(){
  const scores={};
  REGIONS.forEach(r=>{scores[r.id]={name:r.name,total:0,count:0};});
  const counted=new Set();
  [...S.submissions].filter(s=>s.status==='approved')
    .sort((a,b)=>(b.submittedAt?.seconds||0)-(a.submittedAt?.seconds||0))
    .forEach(s=>{
      const key=`${s.regionId}:${s.requirementId}`;
      if(!counted.has(key)&&scores[s.regionId]){
        counted.add(key);
        scores[s.regionId].total+=s.requirementPoints||0;
        scores[s.regionId].count++;
      }
    });
  return Object.entries(scores).map(([id,v])=>({id,...v})).sort((a,b)=>b.total-a.total);
}

// ── FIRESTORE OPS ────────────────────────────────────────────
function subSubs(regionId){
  if(_unsubSubs)_unsubSubs();
  S.submissions=[];
  const q=regionId
    ?query(collection(db,'submissions'),where('regionId','==',regionId))
    :query(collection(db,'submissions'),orderBy('submittedAt','desc'));
  _unsubSubs=onSnapshot(q,snap=>{
    const docs=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(regionId)docs.sort((a,b)=>(b.submittedAt?.seconds||0)-(a.submittedAt?.seconds||0));
    S.submissions=docs; render();
  },err=>toast('Erro ao carregar dados: '+err.message,'error'));
}
function subReqs(){
  if(_unsubReqs)_unsubReqs();
  _unsubReqs=onSnapshot(query(collection(db,'requirements'),orderBy('order','asc')),
    snap=>{S.requirements=snap.docs.map(d=>({id:d.id,...d.data()}));render();});
}
function subUsers(){
  if(_unsubUsers)_unsubUsers();
  _unsubUsers=onSnapshot(collection(db,'users'),
    snap=>{S.users=snap.docs.map(d=>({id:d.id,...d.data()}));render();});
}

async function loginUser(username,password){
  const snap=await getDocs(query(collection(db,'users'),where('username','==',username.toLowerCase().trim())));
  if(snap.empty)throw new Error('Usuário não encontrado');
  const user={id:snap.docs[0].id,...snap.docs[0].data()};
  if(user.password!==password)throw new Error('Senha incorreta');
  if(user.active===false)throw new Error('Usuário inativo');
  return user;
}

async function uploadFile(file,regionId,reqCode){
  const fd=new FormData();
  fd.append('file',file);
  fd.append('reqCode',reqCode||'geral');
  fd.append('regionId',regionId||'geral');
  const res=await fetch(`${UPLOAD_SERVER}/upload`,{method:'POST',body:fd});
  const data=await res.json();
  if(!res.ok||data.error)throw new Error(data.error||`HTTP ${res.status}`);
  return data.url;
}

async function doSubmit(reqId,notes,file){
  S.loading=true;render();
  try{
    const req=S.requirements.find(r=>r.id===reqId);
    const rid=S.currentUser.regionId;
    const subRef=await addDoc(collection(db,'submissions'),{
      regionId:rid,regionName:rname(rid),
      requirementId:reqId,requirementName:req.name,
      requirementPoints:req.points,requirementCategory:req.category,
      notes,proofUrl:null,status:'pending',
      submittedAt:serverTimestamp(),source:'region',
      submittedBy:S.currentUser.username,submittedByName:S.currentUser.name
    });
    S.modal=null;S.selectedReq=null;S.photoFile=null;S.loading=false;render();
    showBanner('✅ Requisito registrado! Aguardando aprovação.');
    if(file){
      try{
        const url=await uploadFile(file,rid,req.code||reqId);
        await updateDoc(doc(db,'submissions',subRef.id),{proofUrl:url});
        toast('📎 Arquivo enviado com sucesso!');
      }catch(e){toast(`⚠️ Falha no upload: ${e.message}`,'error');}
    }
  }catch(e){toast('Erro ao enviar. Tente novamente.','error');S.loading=false;render();}
}

async function review(subId,status,reason=''){
  await updateDoc(doc(db,'submissions',subId),{
    status,rejectionReason:reason,reviewedAt:serverTimestamp(),
    reviewedBy:S.currentUser?.username||'admin',
    reviewedByName:S.currentUser?.name||'Administrador'
  });
  try{
    await addDoc(collection(db,'auditLog'),{
      action:status,submissionId:subId,
      by:S.currentUser?.username,byName:S.currentUser?.name,byRole:S.currentUser?.role,
      reason,at:serverTimestamp()
    });
  }catch(_){}
  const msgs={approved:'✅ Aprovado! Pontos computados.',rejected:'❌ Comprovação rejeitada.',pending:'🔄 Reaberto para revisão.'};
  toast(msgs[status]||'Atualizado.',status==='approved'?'success':status==='pending'?'info':'error');
}

async function doJudgeScore(reqId,regionId,pts){
  const req=S.requirements.find(r=>r.id===reqId);
  const catName=S.currentUser.judgeCategory;
  const existing=S.submissions.find(s=>s.regionId===regionId&&s.requirementId===reqId&&s.source==='judge');
  if(existing){
    await updateDoc(doc(db,'submissions',existing.id),{
      requirementPoints:pts,reviewedAt:serverTimestamp(),
      reviewedBy:S.currentUser.username,reviewedByName:S.currentUser.name,
      notes:`Avaliado por: ${S.currentUser.name} (${catName})`
    });
  }else{
    await addDoc(collection(db,'submissions'),{
      regionId,regionName:rname(regionId),requirementId:reqId,requirementName:req.name,
      requirementPoints:pts,requirementCategory:req.category,
      notes:`Avaliado por: ${S.currentUser.name} (${catName})`,
      proofUrl:null,status:'approved',submittedAt:serverTimestamp(),source:'judge',
      reviewedBy:S.currentUser.username,reviewedByName:S.currentUser.name
    });
  }
  toast(`✅ ${req.name} — ${pts} pts`);
}

async function saveReq(data){
  S.loading=true;render();
  try{
    if(data.id){const{id,...r}=data;await updateDoc(doc(db,'requirements',id),r);}
    else{await addDoc(collection(db,'requirements'),{...data,order:S.requirements.length,active:true});}
    S.modal=null;S.editingReq=null;toast('Requisito salvo! ✅');
  }catch(e){toast('Erro ao salvar.','error');}
  S.loading=false;render();
}
async function delReq(id){
  if(!confirm('Excluir este requisito?'))return;
  await deleteDoc(doc(db,'requirements',id));toast('Excluído.','info');
}

function exportExcel(){
  if(typeof XLSX==='undefined'){toast('Biblioteca de exportação não carregada','error');return;}
  const wb=XLSX.utils.book_new();
  const rows=S.submissions.map(s=>({
    'Região':s.regionName||rname(s.regionId),
    'Requisito':s.requirementName,
    'Categoria':s.requirementCategory,
    'Pontos':s.requirementPoints||0,
    'Status':s.status==='approved'?'Aprovado':s.status==='rejected'?'Rejeitado':'Pendente',
    'Fonte':s.source==='judge'?'Juiz':'Região',
    'Enviado por':s.submittedByName||s.regionName||'—',
    'Enviado em':fmtDate(s.submittedAt),
    'Avaliado por':s.reviewedByName||'—',
    'Avaliado em':fmtDate(s.reviewedAt),
    'Observações':s.notes||''
  }));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Comprovações');
  const scores=computeScores();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(
    scores.map((s,i)=>({'Posição':i+1,'Região':s.name,'Pontos Totais':s.total,'Aprovações':s.count}))
  ),'Ranking');
  XLSX.writeFile(wb,`campori-${new Date().toISOString().slice(0,10)}.xlsx`);
}

// ── VIEW: PORTAL DA REGIÃO ─────────────────────────────────────
function vPortal(){
  const rid=S.currentUser.regionId;
  const reg=REGIONS.find(r=>r.id===rid);
  const mySubs=S.submissions.filter(s=>s.regionId===rid);
  const subByReq={};
  mySubs.forEach(s=>{
    const cur=subByReq[s.requirementId];
    if(!cur||(s.submittedAt?.seconds||0)>(cur.submittedAt?.seconds||0))subByReq[s.requirementId]=s;
  });
  const approved=mySubs.filter(s=>s.status==='approved').reduce((a,s)=>a+(s.requirementPoints||0),0);
  const pending=mySubs.filter(s=>s.status==='pending').reduce((a,s)=>a+(s.requirementPoints||0),0);
  const cats=['Todos',...new Set(S.requirements.map(r=>r.category))];
  const list=(S.filterCat==='Todos'?S.requirements:S.requirements.filter(r=>r.category===S.filterCat))
    .filter(r=>r.active!==false);
  return`
  <div style="min-height:100dvh;background:#f0f4f8;">
    <div style="background:linear-gradient(135deg,#1e3a8a,#1d4ed8);color:#fff;padding:1rem 1rem 1.5rem;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.875rem;">
        <span style="font-size:.82rem;color:#93c5fd;">👤 ${S.currentUser.name}</span>

// ── RENDER ────────────────────────────────────────────────────
function render(){
  let html='';
  if(S.view==='home')html=vHome();
  else if(S.view==='login')html=vLogin();
  else if(S.view==='portal')html=vPortal();
  else if(S.view==='admin')html=vAdmin();
  else if(S.view==='judge')html=vJudge();
  else if(S.view==='ranking')html=vRanking();
  if(S.modal==='submit')html+=mSubmit();
  else if(S.modal==='req-form')html+=mReqForm();
  else if(S.modal==='user-form')html+=mUserForm();
  else if(S.modal==='photo')html+=mPhoto();
  app.innerHTML=html;
}

// ── ACTIONS ────────────────────────────────────────────────────
window.W={
  nav(view){
    S.view=view;S.modal=null;
    if(view==='ranking')subSubs(null);
    render();
  },
  closeModal(){S.modal=null;render();},

  async doLogin(){
    const username=document.getElementById('login-user')?.value?.trim();
    const password=document.getElementById('login-pwd')?.value;
    if(!username||!password){toast('Preencha usuário e senha','error');return;}
    S.loading=true;render();
    try{
      const user=await loginUser(username,password);
      S.currentUser=user;
      sessionStorage.setItem('campori_user',JSON.stringify(user));
      S.loading=false;S.modal=null;S.firstRunPwd=null;
      if(['superadmin','admin','approver'].includes(user.role)){
        subSubs(null);subReqs();
        if(user.role==='superadmin')subUsers();
        S.view='admin';S.adminTab='queue';
      }else if(user.role==='judge'){
        S.judgeRegionId=null;subSubs(null);subReqs();S.view='judge';
      }else if(user.role==='region'){
        subSubs(user.regionId);subReqs();S.view='portal';
      }
      render();
    }catch(e){toast(e.message,'error');S.loading=false;render();}
  },

  logout(){
    S.currentUser=null;sessionStorage.removeItem('campori_user');
    if(_unsubSubs)_unsubSubs();if(_unsubReqs)_unsubReqs();if(_unsubUsers)_unsubUsers();
    _unsubSubs=null;_unsubReqs=null;_unsubUsers=null;
    S.submissions=[];S.requirements=[];S.users=[];
    S.judgeRegionId=null;S.adminTab='queue';
    W.nav('home');
  },

  filterCat(cat){S.filterCat=cat;render();},
  filterStatus(st){S.filterStatus=st;render();},
  setTab(tab){S.adminTab=tab;render();},
  openPhoto(url){S.photoUrl=url;S.modal='photo';render();},

  openSubmit(reqId){S.selectedReq=reqId;S.photoFile=null;S.modal='submit';render();},
  handleFile(evt){
    const f=evt.target.files[0]||null;
    if(f&&f.size>10485760){toast('⚠️ Arquivo muito grande! Máximo 10 MB.','error');evt.target.value='';S.photoFile=null;}
    else S.photoFile=f;
    render();
  },
  async doSubmit(){
    const notes=document.getElementById('sub-notes')?.value||'';
    await doSubmit(S.selectedReq,notes,S.photoFile);
  },

  approve(id){review(id,'approved');},
  reject(id){const r=prompt('Motivo da rejeição (opcional):')||'';review(id,'rejected',r);},
  reopen(id){if(confirm('Reverter para pendente?'))review(id,'pending');},

  openReqForm(id){S.editingReq=id?S.requirements.find(r=>r.id===id):{};S.modal='req-form';render();},
  async saveReq(){
    const name=document.getElementById('rq-name')?.value?.trim();
    const code=document.getElementById('rq-code')?.value?.trim()||name?.toLowerCase().replace(/[^a-z0-9]+/g,'-');
    const desc=document.getElementById('rq-desc')?.value?.trim();
    const cat=document.getElementById('rq-cat')?.value;
    const phase=document.getElementById('rq-phase')?.value;
    const pts=parseInt(document.getElementById('rq-pts')?.value)||0;
    const activeEl=document.getElementById('rq-active');
    const active=activeEl?activeEl.checked:true;
    if(!name){toast('Nome é obrigatório','error');return;}
    if(!pts){toast('Pontuação inválida','error');return;}
    await saveReq({...(S.editingReq?.id?{id:S.editingReq.id}:{}),name,code,description:desc,category:cat,phase,points:pts,active});
  },
  delReq(id){delReq(id);},

  openUserForm(id){
    S.editingUser=id?S.users.find(u=>u.id===id):null;
    S.formRole=S.editingUser?.role||'region';
    S.generatedPwd=genPassword();
    S.modal='user-form';render();
  },
  setFormRole(role){S.formRole=role;render();},
  regenPwd(){S.generatedPwd=genPassword();render();},
  async saveUser(){
    const name=document.getElementById('u-name')?.value?.trim();
    const phone=document.getElementById('u-phone')?.value?.trim();
    const username=document.getElementById('u-username')?.value?.trim().toLowerCase();
    const role=document.getElementById('u-role')?.value;
    const regionId=document.getElementById('u-region')?.value||null;
    const judgeCategory=document.getElementById('u-cat')?.value||null;
    const pwd=document.getElementById('u-pwd')?.value||S.generatedPwd;
    if(!name||!role){toast('Nome e perfil são obrigatórios','error');return;}
    if(!S.editingUser&&!username){toast('Usuário é obrigatório','error');return;}
    if(role==='region'&&!regionId){toast('Selecione uma região','error');return;}
    if(role==='judge'&&!judgeCategory){toast('Selecione uma categoria','error');return;}
    S.loading=true;render();
    try{
      if(S.editingUser){
        await updateDoc(doc(db,'users',S.editingUser.id),{name,phone:phone||'',role,regionId:regionId||null,judgeCategory:judgeCategory||null});
        toast('Usuário atualizado! ✅');
      }else{
        const snap=await getDocs(query(collection(db,'users'),where('username','==',username)));
        if(!snap.empty){toast('Este usuário já existe','error');S.loading=false;render();return;}
        await addDoc(collection(db,'users'),{
          name,phone:phone||'',username,password:pwd,role,
          regionId:regionId||null,judgeCategory:judgeCategory||null,
          active:true,createdAt:serverTimestamp(),createdBy:S.currentUser?.username||'system'
        });
        toast(`✅ Usuário criado! Senha: ${pwd}`);
        setTimeout(()=>alert(`Usuário: ${username}\nSenha: ${pwd}\n\nAnote antes de fechar!`),300);
      }
      S.modal=null;S.editingUser=null;
    }catch(e){toast(e.message,'error');}
    S.loading=false;render();
  },
  async toggleUserActive(id,currentlyActive){
    await updateDoc(doc(db,'users',id),{active:!currentlyActive});
    toast(currentlyActive?'Usuário desativado':'Usuário ativado!');
  },

  exportExcel(){exportExcel();},

  selectJudgeRegion(id){S.judgeRegionId=id;render();},
  async submitJudgeScore(reqId,regionId){
    const pts=parseInt(document.getElementById(`pts-${reqId}`)?.value)||0;
    const req=S.requirements.find(r=>r.id===reqId);
    if(pts<0||pts>req.points){toast(`Valor entre 0 e ${req.points}`,'error');return;}
    await doJudgeScore(reqId,regionId,pts);render();
  },
};

// ── INIT ──────────────────────────────────────────────────────
(async()=>{
  // Restaurar sessão
  try{
    const saved=sessionStorage.getItem('campori_user');
    if(saved)S.currentUser=JSON.parse(saved);
  }catch(_){}

  // Primeiro acesso: criar superadmin padrão se não existir
  try{
    const snap=await getDocs(collection(db,'users'));
    if(snap.empty){
      const pwd=genPassword();
      await setDoc(doc(db,'users','initial-admin'),{
        name:'Super Admin',phone:'',username:'admin',password:pwd,
        role:'superadmin',active:true,createdAt:serverTimestamp()
      });
      S.firstRunPwd=pwd;
    }
  }catch(e){console.warn('Init error:',e);}

  // Se já logado, carregar dados e ir para a view correta
  if(S.currentUser&&!S.firstRunPwd){
    subReqs();
    if(['superadmin','admin','approver'].includes(S.currentUser.role)){
      subSubs(null);
      if(S.currentUser.role==='superadmin')subUsers();
      S.view='admin';
    }else if(S.currentUser.role==='judge'){
      subSubs(null);S.view='judge';
    }else if(S.currentUser.role==='region'){
      subSubs(S.currentUser.regionId);S.view='portal';
    }
  }

  render();
})();
</script>
