<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Entrar — ÍNTEGROS · III Campori de Líderes APV</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/favicon-180.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/base.css">
</head>
<body>

<div id="app">
  <div style="display:flex;align-items:center;justify-content:center;min-height:100dvh;">
    <div class="spinner"></div>
  </div>
</div>

<script type="module">
import { guardLogin, saveSession, portalUrlForUser } from '../js/auth.js';
import { loginUser, ensureInitialAdmin, toast, fetchPublicRanking, renderAnonRanking } from '../js/api.js';

const app = document.getElementById('app');
let loading = false;
let firstRunPwd = null;
let rankingHtml = null;

// Se já autenticado, redireciona imediatamente para o portal
if (guardLogin()) {
  // guardLogin() chamou location.replace() — execução encerra aqui
} else {
  init();
}

async function init() {
  try {
    firstRunPwd = await ensureInitialAdmin();
  } catch (e) {
    console.warn('Erro ao verificar usuários:', e);
  }
  render();
  try {
    const scores = await fetchPublicRanking();
    rankingHtml = renderAnonRanking(scores);
  } catch (e) {
    console.warn('Erro ao carregar ranking público:', e);
  }
  render();
}

function render() {
  app.innerHTML = `
  <div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:1.5rem;background:linear-gradient(160deg,#0D2B6E 0%,#123a8f 55%,#1ABFCF 100%);">

    ${firstRunPwd ? `
    <div style="background:#fef9c3;color:#713f12;border-radius:1rem;padding:1rem 1.25rem;
      margin-bottom:1.5rem;width:100%;max-width:340px;font-size:.85rem;text-align:center;">
      <div style="font-weight:800;margin-bottom:.25rem;">🔑 Primeiro acesso criado</div>
      <div>Usuário: <strong>admin</strong></div>
      <div>Senha: <strong>${firstRunPwd}</strong></div>
      <div style="font-size:.75rem;margin-top:.375rem;color:#92400e;">Guarde estas credenciais antes de continuar!</div>
    </div>` : ''}

    <div style="text-align:center;margin-bottom:1.5rem;">
      <img src="/assets/logo-integros-completo.png" alt="ÍNTEGROS — III Campori de Líderes APV"
        style="height:11rem;width:auto;object-fit:contain;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35));margin-bottom:.25rem;">
      <p style="color:rgba(255,255,255,.75);font-size:.78rem;margin:.1rem 0 0;">Associação Paulista do Vale</p>
    </div>

    <div style="background:#fff;border-radius:1.5rem;padding:2rem;width:100%;max-width:340px;">
      <div style="display:flex;flex-direction:column;gap:.875rem;">
        <div>
          <label style="display:block;font-size:.82rem;font-weight:700;color:#374151;margin-bottom:.375rem;">Usuário</label>
          <input type="text" id="login-user" placeholder="seu.usuario" autocomplete="username"
            style="width:100%;border:1.5px solid #e2e8f0;border-radius:.875rem;padding:1rem;font-size:.95rem;outline:none;"
            onkeydown="if(event.key==='Enter')document.getElementById('login-pwd').focus()">
        </div>
        <div>
          <label style="display:block;font-size:.82rem;font-weight:700;color:#374151;margin-bottom:.375rem;">Senha</label>
          <input type="password" id="login-pwd" placeholder="••••••••" autocomplete="current-password"
            style="width:100%;border:1.5px solid #e2e8f0;border-radius:.875rem;padding:1rem;font-size:1rem;outline:none;"
            onkeydown="if(event.key==='Enter')W.doLogin()">
        </div>
        <button onclick="W.doLogin()" id="btn-login" ${loading ? 'disabled' : ''}
          style="width:100%;background:#D4A017;color:#1e293b;border:none;padding:1.1rem;
          border-radius:1rem;font-size:1rem;font-weight:800;cursor:pointer;margin-top:.25rem;
          opacity:${loading ? .6 : 1};">
          ${loading ? '⏳ Entrando...' : '🔐 Entrar'}
        </button>
      </div>
    </div>

    ${rankingHtml ? `
    <div style="background:rgba(255,255,255,.95);border-radius:1.25rem;padding:1.25rem;width:100%;max-width:340px;margin-top:1.25rem;">
      <div style="font-weight:800;color:#1e293b;font-size:.9rem;margin-bottom:.75rem;text-align:center;">🏆 Ranking Geral das Unidades</div>
      ${rankingHtml}
    </div>` : ''}

    <div style="display:flex;align-items:center;gap:.5rem;margin-top:1.75rem;opacity:.85;">
      <img src="/assets/logo-apv.png" alt="APV" style="height:1.6rem;width:auto;object-fit:contain;">
      <span style="color:rgba(255,255,255,.75);font-size:.72rem;">Um evento da Associação Paulista do Vale</span>
    </div>
  </div>`;
}

window.W = {
  async doLogin() {
    const username = document.getElementById('login-user')?.value?.trim();
    const password = document.getElementById('login-pwd')?.value;
    if (!username || !password) { toast('Preencha usuário e senha', 'error'); return; }
    loading = true;
    render();
    try {
      const { user, token } = await loginUser(username, password);
      saveSession(user, token);
      location.replace(portalUrlForUser(user));
    } catch (e) {
      toast(e.message, 'error');
      loading = false;
      render();
      // Refocar o campo de senha após erro
      setTimeout(() => document.getElementById('login-pwd')?.focus(), 50);
    }
  }
};
</script>
</body>
</html>
