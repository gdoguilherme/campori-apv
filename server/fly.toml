# Fly.io — Campori APV Upload Server
# Antes do primeiro deploy: fly apps create campori-apv-upload
app            = "campori-apv-upload"
primary_region = "gru"   # São Paulo

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port       = 8080
  force_https         = true
  auto_stop_machines  = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes           = ["app"]

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory   = "256mb"
  cpu_kind = "shared"
  cpus     = 1
